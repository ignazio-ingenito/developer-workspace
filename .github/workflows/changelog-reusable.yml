name: Changelog reusable

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the dedicated changelog GitHub App
        required: true
        type: string
    secrets:
      app-private-key:
        description: Private key of the dedicated changelog GitHub App
        required: true

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'ignazio-changelog[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Check out the pull request head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the write target
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" != "$DEFAULT_BRANCH"
          git fetch --force --tags origin

      - name: Select git-cliff configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f cliff.toml ]]; then
            printf 'CLIFF_CONFIG=%s\n' "$GITHUB_WORKSPACE/cliff.toml" >> "$GITHUB_ENV"
            exit 0
          fi

          cat > "$RUNNER_TEMP/changelog-cliff.toml" <<'EOF'
          # BEGIN COMMON CLIFF CONFIG
          [changelog]
          header = """
          # Changelog

          All notable changes to this project are documented in this file.

          """
          body = """
          {% if version %}\
          ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
          ## Unreleased
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}

          ### {{ group | striptags | trim }}
          {% for commit in commits %}
          - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
          {% endfor %}
          {% endfor %}
          """
          trim = true
          render_always = true

          [git]
          conventional_commits = true
          filter_unconventional = false
          split_commits = false
          protect_breaking_commits = true
          filter_commits = false
          fail_on_unmatched_commit = false
          topo_order = false
          topo_order_commits = true
          sort_commits = "oldest"
          commit_parsers = [
            { message = '^docs\(changelog\): update$', skip = true },
            { message = '^feat', group = '<!-- 0 -->Features' },
            { message = '^fix', group = '<!-- 1 -->Bug fixes' },
            { message = '^perf', group = '<!-- 2 -->Performance' },
            { message = '^refactor', group = '<!-- 3 -->Refactoring' },
            { message = '^docs?', group = '<!-- 4 -->Documentation' },
            { message = '^tests?', group = '<!-- 5 -->Tests' },
            { message = '^ci', group = '<!-- 6 -->CI' },
            { message = '^revert', group = '<!-- 8 -->Reverts' },
            { message = '^chore|^build|^style|.*', group = '<!-- 7 -->Maintenance' },
          ]
          # END COMMON CLIFF CONFIG
          EOF
          printf 'CLIFF_CONFIG=%s\n' "$RUNNER_TEMP/changelog-cliff.toml" >> "$GITHUB_ENV"

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          version: v2.13.1
          config: ${{ env.CLIFF_CONFIG }}
          args: --no-exec --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md when changed
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -z $(git status --porcelain -- CHANGELOG.md) ]]; then
            echo "CHANGELOG.md is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md

          staged=$(git diff --cached --name-only)
          test "$staged" = "CHANGELOG.md"

          git commit -m "docs(changelog): update"
          git push origin "HEAD:$HEAD_REF"
