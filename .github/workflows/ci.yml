name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: developer-workspace:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm --entrypoint /usr/local/lib/developer-workspace/smoke-test.sh developer-workspace:test
      - name: Playwright Chromium acceptance
        run: docker run --rm --entrypoint /usr/local/lib/developer-workspace/test-playwright-runtime.sh developer-workspace:test
      - name: Publish development images
        uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/developer-workspace:latest
            ghcr.io/${{ github.repository_owner }}/developer-workspace:sha-${{ github.sha }}
          cache-from: type=gha
      - name: Publish versioned image
        uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/developer-workspace:${{ github.ref_name }}
          cache-from: type=gha
