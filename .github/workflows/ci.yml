name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_LOCAL: developer-workspace:ci-${{ github.sha }}
  IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/developer-workspace
  IMAGE_ARTIFACT: developer-workspace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REMOTE }}
          flavor: latest=false
          tags: |
            type=raw,value={{date 'YYYY.MM.DD' tz='Europe/Rome'}}_${{ github.run_number }}
            type=sha,format=long

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build exact image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_LOCAL }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/developer-workspace.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load exact image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: Smoke test
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/smoke-test.sh
          "$IMAGE_LOCAL"

      - name: Playwright Chromium acceptance
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/test-playwright-runtime.sh
          "$IMAGE_LOCAL"


      - name: Block actionable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      # Re-running a workflow keeps the same run_number. Publishing only the
      # first attempt prevents an immutable CalVer tag from being overwritten.
      - name: Preserve verified image artifact
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main' &&
            github.run_attempt == 1
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp/developer-workspace.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify]
    if: >-
      ${{
        needs.verify.result == 'success' &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp

      - name: Load verified image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        run: docker push --all-tags "$IMAGE_REMOTE"
