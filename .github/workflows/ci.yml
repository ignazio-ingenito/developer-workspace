name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE_LOCAL: developer-workspace:sha-${{ github.sha }}
  IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/developer-workspace
  IMAGE_ARTIFACT: developer-workspace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Test Trivy availability-first policy
        run: bash tests/test-trivy-policy.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build exact image artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_LOCAL }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/developer-workspace.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load exact image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: Smoke test
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/smoke-test.sh
          "$IMAGE_LOCAL"

      - name: Playwright Chromium acceptance
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/test-playwright-runtime.sh
          "$IMAGE_LOCAL"

      - name: Generate HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: json
          output: trivy-high-critical.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.69.3
          exit-code: '0'

      - name: Enforce availability-first vulnerability policy
        run: bash scripts/check-trivy-policy.sh trivy-high-critical.json

      - name: Verify exact image artifact
        run: |
          set -euo pipefail
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_LOCAL")"
          test "$revision" = "$GITHUB_SHA"

      - name: Preserve verified image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp/developer-workspace.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify]
    if: >-
      ${{
        needs.verify.result == 'success' &&
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp

      - name: Load and verify exact image artifact
        run: |
          set -euo pipefail
          docker load --input /tmp/developer-workspace.tar
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_LOCAL")"
          test "$revision" = "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish development images
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for tag in latest "sha-${GITHUB_SHA}"; do
            target="${IMAGE_REMOTE}:${tag}"
            docker tag "$IMAGE_LOCAL" "$target"
            docker push "$target"
          done

      - name: Publish versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          target="${IMAGE_REMOTE}:${GITHUB_REF_NAME}"
          docker tag "$IMAGE_LOCAL" "$target"
          docker push "$target"
