name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE_LOCAL: developer-workspace:sha-${{ github.sha }}
  IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/developer-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build exact image artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_LOCAL }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/developer-workspace.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load exact image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: Smoke test
        run: docker run --rm --entrypoint /usr/local/lib/developer-workspace/smoke-test.sh "$IMAGE_LOCAL"

      - name: Playwright Chromium acceptance
        run: docker run --rm --entrypoint /usr/local/lib/developer-workspace/test-playwright-runtime.sh "$IMAGE_LOCAL"

      - name: Report HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.69.3
          exit-code: '0'

      - name: Block fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.69.3
          exit-code: '1'

      - name: Verify exact image artifact
        run: |
          set -euo pipefail
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_LOCAL")"
          test "$revision" = "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish development images
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for tag in latest "sha-${GITHUB_SHA}"; do
            target="${IMAGE_REMOTE}:${tag}"
            docker tag "$IMAGE_LOCAL" "$target"
            docker push "$target"
          done

      - name: Publish versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          target="${IMAGE_REMOTE}:${GITHUB_REF_NAME}"
          docker tag "$IMAGE_LOCAL" "$target"
          docker push "$target"
